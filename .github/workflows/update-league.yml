# Actualizează automat site-ul:
#   • clasament / rezultate / program / goluri jucători  ← alborzminifotbal.ro
#   • MVP / Fan Favorite (+ poza postării)              ← postările @fc__basarabia (Instagram)
# Dacă s-a schimbat ceva, face commit → Vercel republică site-ul singur.
name: Actualizare site

on:
  schedule:
    # ora UTC; România = UTC+2/+3. Zilnic la ~09, 15, 21 și 00 ora României
    - cron: '0 6,12,18,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # proiectul poate fi în rădăcina repo-ului sau într-un subfolder (ex. basarabia-main)
      # caută folderul care are ȘI package.json ȘI scripts/update-league.mjs (ignoră copiile rătăcite)
      - name: Găsește folderul site-ului
        run: |
          APP_DIR=""
          for f in $(find . -type f -path '*/scripts/update-league.mjs' -not -path '*/node_modules/*' | awk '{ print length, $0 }' | sort -n | cut -d' ' -f2-); do
            d=$(dirname "$(dirname "$f")")
            if [ -f "$d/package.json" ]; then APP_DIR="$d"; break; fi
          done
          if [ -z "$APP_DIR" ]; then echo "::error::Nu găsesc folderul site-ului (package.json + scripts/update-league.mjs)"; exit 1; fi
          echo "Folderul site-ului: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Liga — clasament, rezultate, goluri
        working-directory: ${{ env.APP_DIR }}
        run: node scripts/update-league.mjs

      - name: Instagram — MVP / Fan Favorite
        id: ig
        continue-on-error: true
        working-directory: ${{ env.APP_DIR }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/update-instagram.mjs

      - name: Commit dacă s-a schimbat ceva
        working-directory: ${{ env.APP_DIR }}
        run: |
          git add -A src/data/league-auto.json src/data/instagram-auto.json
          if [ -d public/instagram ] || git ls-files --error-unmatch public/instagram >/dev/null 2>&1; then git add -A public/instagram; fi
          if git diff --cached --quiet; then
            echo "Nicio schimbare."
            exit 0
          fi
          git config user.name  "fc-basarabia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Date actualizate automat (ligă / Instagram)"
          git push
          echo "changed=1" >> "$GITHUB_ENV"

      - name: Pornește deploy Vercel (opțional)
        if: env.changed == '1'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; else echo "Fără deploy hook — Vercel preia commit-ul."; fi

      - name: Verifică Instagram
        if: steps.ig.outcome == 'failure'
        run: |
          echo "::error::Instagram nu a răspuns — probabil a expirat cheia IG_ACCESS_TOKEN. Generează una nouă (vezi INSTAGRAM.md)."
          exit 1
